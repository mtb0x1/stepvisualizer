[package]
name = "stepvisualizer"
version = "0.0.1"
authors = ["mtb0x1"]
description = "A WebAssembly-based 3D STEP file visualizer built with Rust and WebGPU."
keywords = ["stepfile", "stepvisualizer", "webgpu", "wasm", "step-rs", "csr"]
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
approx = "0.5"

[dependencies]
gloo = "0.11.0"
js-sys = "0.3.81"
# Generic STEP AST is parsed by ruststep (supports AP201/AP203 only; AP214/AP209 unsupported)
ruststep = { version = "0.4.0", features = ["ap201", "ap203"] }
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.81", features = [
    "HtmlCanvasElement",
    "ResizeObserver",
    "Window",
    "Document",
    "Performance",
    "Navigator",
    "Storage",
] }
yew = { version = "0.21.0", features = ["csr"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-storage = "0.3"
wgpu = { version = "30.0.1", features = ["webgpu", "wgsl", "web"] }
time = { version = "0.3.44", features = ["wasm-bindgen"] }
tracing = "0.1.41"
tracing-web = "0.1.3"
tracing-subscriber = { version = "0.3.20", features = [
    "env-filter",
    "json",
    "time",
] }
truck-stepio = "0.3.0"
truck-polymesh = "0.6.0"
truck-modeling = "0.6.0"
truck-meshalgo = "0.4.0"
truck-topology = "0.6.0"
bytemuck = { version = "1.18.0", features = ["wasm_simd"] }
truck-geometry = "0.5.0"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rexie = "0.6"
gloo-worker = "0.5"


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
