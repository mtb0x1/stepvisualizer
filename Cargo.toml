[package]
name = "stepvisualizer"
version = "0.0.1"
authors = ["mtb0x1"]
description = "A WebAssembly-based 3D STEP file visualizer built with Rust and WebGPU."
keywords = ["stepfile", "stepvisualizer", "webgpu", "wasm", "step-rs", "csr"]
edition = "2024"
license-file = "LICENSE"

[lib]
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
approx = "0.5"

[dependencies]
gloo = { version = "0.12.0", default-features = false, features = ["file"] }
js-sys = { version = "0.3.81", default-features = false }
wasm-bindgen = { version = "0.2.127", default-features = false }
wasm-bindgen-futures = { version = "0.4.77", default-features = false }
web-sys = { version = "0.3.81", default-features = false, features = [
    "DomRect",
    "Element",
    "HtmlCanvasElement",
    "ResizeObserver",
    "Window",
    "Document",
    "Performance",
    "Navigator",
    "Storage",
    "CustomEvent",
    "CustomEventInit",
] }
yew = { version = "0.23.0", features = ["csr"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false }
wgpu = { version = "30.0.1", default-features = false, features = [
    "webgpu",
    "wgsl",
    "web",
] }
time = { version = "0.3.44", default-features = false, features = [
    "wasm-bindgen",
] }
tracing = { version = "0.1.41", default-features = false }
tracing-web = { version = "0.1.3", default-features = false }
tracing-subscriber = { version = "0.3.20", default-features = false, features = [
    "std",
    "fmt",
    "ansi",
    "env-filter",
    "json",
    "time",
] }

#note this is need so we can do `truck_stepio::r#in::ruststep::ap20*` later.
#Do not remove the dep. below
ruststep = { version = "0.4.0", default-features = false, features = [
    "ap201",
    "ap203",
] }
truck-stepio = { version = "0.3.0", default-features = false, features = [
    "in",
    "derive",
] }
truck-polymesh = { version = "0.6.0", default-features = false }
truck-modeling = { version = "0.6.0", default-features = false }
truck-meshalgo = { version = "0.4.0", default-features = false, features = [
    "tessellation",
] }
truck-topology = { version = "0.6.0", default-features = false }
truck-geometry = { version = "0.5.0", default-features = false }
bytemuck = "1.18.0"
glam = { version = "0.33.6", default-features = false, features = [
    "std",
    "all-types",
    "bytemuck",
    "serde",
    "fast-math",
    "rkyv",
    "bytecheck",
] }
xxhash-rust = { version = "0.8", default-features = false, features = ["xxh3"] }
rexie = { version = "0.6", default-features = false }
smallvec = { version = "1.15.1", default-features = false, features = [
    "serde",
] }
arrayvec = { version = "0.7.6", default-features = false, features = ["serde"] }
rkyv = { version = "0.8.18", default-features = false, features = [
    "std",
    "bytecheck",
    "smallvec-1",
    "smol_str-0_3",
] }
smol_str = { version = "0.3.2", default-features = false, features = ["serde"] }
csscolorparser = { version = "0.8.4", default-features = false, features = [
    "named-colors",
] }
# Pinned to 0.17 to match transitive version required by wgpu 30 / naga.
# Do NOT upgrade or change version independently to avoid duplicate crate compilation in WASM.
hashbrown = { version = "0.17", default-features = false, features = [
    "default-hasher",
] }
# Pinned to 0.13 to match transitive version required by csscolorparser.
# Do NOT upgrade or change version independently to avoid duplicate crate compilation in WASM.
phf = { version = "0.13", default-features = false, features = ["macros"] }


[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"
strip = true
