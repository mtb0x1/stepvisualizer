<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>StepVisualizer Benchmark Suite</title>
  <link data-trunk rel="rust" href="Cargo.toml" data-wasm-opt="4" data-wasm-opt-params="--all-features" />
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background-color: #0f172a;
      color: #f8fafc;
    }
    h1 {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #38bdf8;
    }
    #status {
      padding: 12px 16px;
      background: #1e293b;
      border-radius: 6px;
      border-left: 4px solid #38bdf8;
      margin-bottom: 16px;
      font-size: 0.95rem;
    }
    #output {
      font-family: "JetBrains Mono", Consolas, monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      background: #020617;
      padding: 16px;
      border-radius: 6px;
      border: 1px solid #334155;
      max-height: 400px;
      overflow-y: auto;
    }
    canvas {
      width: 400px;
      height: 300px;
      border: 1px solid #334155;
      border-radius: 6px;
      background: #000;
      margin-top: 16px;
      display: block;
    }
  </style>
</head>
<body>
  <h1>StepVisualizer Hot-Path Benchmark (WebGPU)</h1>
  <div id="status">Initializing WebAssembly & WebGPU harness...</div>
  <pre id="output">Waiting for benchmark to start...</pre>
  <canvas id="benchmark-canvas" width="800" height="600"></canvas>
</body>
</html>
