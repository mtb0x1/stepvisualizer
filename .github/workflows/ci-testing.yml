name: CI — Testing

on:
  push:
    branches: [testing]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Setup Toolchain and Environment
        uses: ./.github/actions/toolchain_and_env
        with:
          install-wasm-pack: 'true'

      - name: Cargo Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Cargo Clippy
        run: |
          rustup component add clippy
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Cargo Test
        run: wasm-pack test --headless --firefox --release

      - name: Build Yew App
        run: trunk build --release --dist ./dist --public-url ./

      - name: Copy index.html to 404.html
        run: cp ./dist/index.html ./dist/404.html

      - name: Deploy to gh-pages/testing/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: testing
          keep_files: true

