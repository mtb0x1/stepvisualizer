name: CI — Testing

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (nightly + wasm target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown

      - name: Install trunk (prebuilt binary)
        env:
          TRUNK_VERSION: v0.21.14
        run: |
          curl -fsSL -o /tmp/trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o /tmp/trunk.tar.gz.sha256 "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256"
          EXPECTED=$(cat /tmp/trunk.tar.gz.sha256)
          ACTUAL=$(sha256sum /tmp/trunk.tar.gz)
          test "$EXPECTED" = "${ACTUAL%% *}"
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/trunk.tar.gz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install wasm-pack
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cargo Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Cargo Clippy
        run: |
          rustup component add clippy
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Cargo Test
        run: wasm-pack test --headless --firefox

      # Build with a relative public-url so the same artifact is valid in any
      # subdirectory (testing/ or production/) without a rebuild.
      - name: Build Yew App
        run: trunk build --release --dist ./dist --public-url ./

      - name: Copy index.html to 404.html
        run: cp ./dist/index.html ./dist/404.html

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-dist-${{ github.sha }}
          path: ./dist

  deploy-testing:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: app-dist-${{ github.sha }}
          path: ./dist

      - name: Deploy to gh-pages/testing/
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          destination_dir: testing
          keep_files: true

      - name: Deploy landing page to gh-pages root
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./landing
          publish_branch: gh-pages
          destination_dir: .
          keep_files: true

  advance-testing-branch:
    runs-on: ubuntu-latest
    needs: deploy-testing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Fast-forward the `testing` source branch to the current master HEAD.
      # This only runs after deploy-testing succeeds, so `testing` always
      # reflects what is actually live in the testing environment.
      - name: Fast-forward testing branch to master
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout testing
          git merge --ff-only origin/master
          git push origin testing
