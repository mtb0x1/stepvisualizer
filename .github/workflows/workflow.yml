name: Deploy Yew site

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (nightly + wasm target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown
      - name: Install trunk (prebuilt binary)
        env:
          TRUNK_VERSION: v0.21.14
        run: |
          curl -fsSL -o /tmp/trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o /tmp/trunk.tar.gz.sha256 "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256"
          EXPECTED=$(cat /tmp/trunk.tar.gz.sha256)
          ACTUAL=$(sha256sum /tmp/trunk.tar.gz)
          test "$EXPECTED" = "${ACTUAL%% *}"
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/trunk.tar.gz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Cargo Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Cargo Clippy
        run: |
          rustup component add clippy
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Build Yew App
        run: trunk build --release --dist ./dist --public-url /stepvisualizer/

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-dist
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v5
        with:
          name: app-dist
          path: ./dist
      
      #? I guess we need to cheat 404 errors
      - name: Copy index.html to 404.html
        run: cp ./dist/index.html ./dist/404.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
