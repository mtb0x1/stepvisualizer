name: CI — Master

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Toolchain and Environment
        uses: ./.github/actions/toolchain_and_env
        with:
          install-wasm-pack: 'true'

      - name: Cargo Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Cargo fmt
        run: |
          rustup component add rustfmt
          cargo fmt --check

      - name: Cargo Clippy
        run: |
          rustup component add clippy
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Cargo Test
        run: wasm-pack test --headless --firefox --release

      # Build to catch any trunk/wasm compilation failures early.
      # Output is discarded — no artifact upload, no deploy.
      - name: Build Yew App
        run: trunk build --release --dist ./dist --public-url ./

      - name: Check Wasm File Size
        run: |
          for WASM_FILE in ./dist/*.wasm; do
            if [ ! -f "$WASM_FILE" ]; then
              echo "Error: No wasm file found in ./dist"
              exit 1
            fi
            SIZE=$(stat -c%s "$WASM_FILE")
            MAX_SIZE=2097152 # 2MB
            echo "Wasm file size for $WASM_FILE: $SIZE bytes"
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "Error: Wasm file size ($SIZE bytes) exceeds the maximum allowed limit of 2MB ($MAX_SIZE bytes)."
              exit 1
            fi
          done
          echo "Wasm file(s) size is within limits."
