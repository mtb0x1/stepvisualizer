name: CI — Master

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (nightly + wasm target)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          target: wasm32-unknown-unknown

      - name: Install trunk (prebuilt binary)
        env:
          TRUNK_VERSION: v0.21.14
        run: |
          curl -fsSL -o /tmp/trunk.tar.gz "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o /tmp/trunk.tar.gz.sha256 "https://github.com/trunk-rs/trunk/releases/download/${TRUNK_VERSION}/trunk-x86_64-unknown-linux-gnu.tar.gz.sha256"
          EXPECTED=$(cat /tmp/trunk.tar.gz.sha256)
          ACTUAL=$(sha256sum /tmp/trunk.tar.gz)
          test "$EXPECTED" = "${ACTUAL%% *}"
          mkdir -p "${HOME}/.local/bin"
          tar -xzf /tmp/trunk.tar.gz -C "${HOME}/.local/bin"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Install wasm-pack
        run: curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cargo Check
        run: cargo check --target wasm32-unknown-unknown

      - name: Cargo Clippy
        run: |
          rustup component add clippy
          cargo clippy --target wasm32-unknown-unknown -- -D warnings

      - name: Cargo Test
        run: wasm-pack test --headless --firefox

      # Build to catch any trunk/wasm compilation failures early.
      # Output is discarded — no artifact upload, no deploy.
      - name: Build Yew App
        run: trunk build --release --dist ./dist --public-url ./
